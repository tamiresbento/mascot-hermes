[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devpytech-mascot-studio"
version = "0.1.0"
description = "Editor Python de mascotes e companheiros flutuantes para seus agentes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "DevPyTech"}]
dependencies = ["Pillow>=11,<13", "PySide6-Essentials>=6.8,<7"]
keywords = ["mascot", "desktop-pet", "python", "hermes", "agents", "pyside6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
mascot-studio = "mascot_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mascot_studio = ["assets/*.png", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
